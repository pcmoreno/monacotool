name: Tests

on:
  push:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: monacotool_test
          MYSQL_USER: local_user
          MYSQL_PASSWORD: local_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=test_secret_not_used_in_production
          APP_SHARE_DIR=var/share
          DEFAULT_URI=http://127.0.0.1
          DATABASE_URL=mysql://local_user:local_db@127.0.0.1:3306/monacotool?serverVersion=8.0.32&charset=utf8mb4
          MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0
          MAILER_DSN=null://null
          MAILER_FROM=noreply@test.local
          INVITE_TOKEN_EXPIRY_DAYS=2
          NUMBER_OF_SIMULATIONS=500
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build Tailwind CSS
        run: php bin/console tailwind:build

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        run: php bin/phpunit
