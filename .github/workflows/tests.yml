name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: monacotool
          MYSQL_USER: local_user
          MYSQL_PASSWORD: local_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      APP_SECRET: test_secret_not_used_in_production
      DATABASE_URL: mysql://local_user:local_db@127.0.0.1:3306/monacotool?serverVersion=8.0.32&charset=utf8mb4
      MAILER_DSN: "null://null"
      MAILER_FROM: noreply@test.local
      INVITE_TOKEN_EXPIRY_DAYS: 2
      NUMBER_OF_SIMULATIONS: 500

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: echo "APP_ENV=test" > .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        run: php bin/phpunit
