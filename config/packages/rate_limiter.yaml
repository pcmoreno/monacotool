# Rate limiter uses the default cache pool (in-memory in dev, file-based otherwise).
# For production deployments with multiple server instances, configure a shared
# cache adapter (e.g. Redis) via framework.cache.pools or the CACHE_DSN env var.
framework:
    rate_limiter:
        register:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        resend_verification:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        forgot_password:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        reset_password:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
